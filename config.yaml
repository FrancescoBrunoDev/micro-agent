# micro-agent configuration
# Path: ~/.micro-agent/config.yaml

gateway:
  host: 127.0.0.1
  port: 8765
  log_level: info

pi:
  binary: pi
  provider: openai  # Use any OpenAI-compatible endpoint
  model: ""         # Set via env: MICRO_AGENT_MODEL
  # session_dir: ~/.micro-agent/sessions
  extra_args: []

memory:
  path: ~/.micro-agent/memory
  max_context_files: 3
  auto_compact_threshold: 500

# Telegram integration (optional)
# telegram:
#   bot_token: ${TELEGRAM_BOT_TOKEN}
#   webhook_secret: "your-secret-here"
#   allowed_chat_ids: []

