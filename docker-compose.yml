# micro-agent — herdr + pi + kDrive sync in one portable container.
# Runs anywhere Docker runs (Coolify, VPS, home server). No ports, no web UI:
# interact via `docker exec -it micro-agent herdr` or herdr agent prompt.
#
#   cp .env.example .env
#   docker compose up -d --build

services:
  micro-agent:
    build: .
    container_name: micro-agent
    hostname: micro-agent
    restart: unless-stopped
    # Reach an LLM running on the docker host itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Single named volume = all persistent state (pi config/sessions,
    # herdr config/layout, rclone config, synced vault). On Coolify use a
    # persistent volume attached to /data.
    volumes:
      - micro-agent-data:/data
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - PI_PROVIDER=${PI_PROVIDER:-local}
      - PI_MODEL_NAME=${PI_MODEL_NAME:-}
      - KDRIVE_URL=${KDRIVE_URL:-}
      - KDRIVE_USER=${KDRIVE_USER:-}
      - KDRIVE_PASS=${KDRIVE_PASS:-}
      - KDRIVE_VAULT_PATH=${KDRIVE_VAULT_PATH:-Obsidian/Francesco_Vault}
      - KDRIVE_SYNC_INTERVAL=${KDRIVE_SYNC_INTERVAL:-60}
    healthcheck:
      test: ["CMD-SHELL", "herdr status server 2>/dev/null | grep -q 'status: running'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  micro-agent-data:
