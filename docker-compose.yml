# PI WEB — docker-compose (single service)
# Web UI for Pi Coding Agent, ready for Coolify deployment.
# All configuration is via environment variables — no external file mounts.
#
# Usage:
#   cp .env.example .env      # Copy env template
#   docker compose up -d --build
#   # Open http://localhost:8505
#
# Or deploy on Coolify: import, set env vars, deploy.

services:
  pi-web:
    build:
      context: .
      dockerfile: docker/pi-web/Dockerfile
    container_name: ${PI_WEB_CONTAINER_PREFIX:-pi-web}
    restart: unless-stopped
    # FUSE is required for rclone mount (KDrive access via WebDAV).
    # On Coolify these can also be set in the container settings UI.
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "${PI_WEB_BIND_ADDR:-127.0.0.1}:${PI_WEB_HOST_PORT:-8505}:8504"
    volumes:
      # Named volume — managed by Docker/Coolify, no host path needed
      - pi-web-data:/data
    environment:
      - PI_WEB_HOST=0.0.0.0
      - PI_WEB_PORT=8504
      - PI_WEB_DATA_DIR=/data/pi-web
      - PI_WEB_SESSIOND_SOCKET=/data/pi-web/sessiond.sock
      - PI_CODING_AGENT_DIR=/data/pi-agent
      # LLM endpoint — set in .env or Coolify dashboard.
      # NOTE: do NOT pass OPENAI_API_KEY globally — it marks Pi's built-in
      # openai provider as "configured", making its gpt-* models appear in
      # the UI. The API key is set per-provider inside models.json instead.
      - OPENAI_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      # GitHub CLI — optional token so gh/git work in the container
      - GH_TOKEN=${GH_TOKEN:-}
      - GH_USER_NAME=${GH_USER_NAME:-}
      - GH_USER_EMAIL=${GH_USER_EMAIL:-}
      # KDrive (Infomaniak) via WebDAV + rclone — optional.
      # Endpoint: https://<kDriveId>.connect.kdrive.infomaniak.com
      # Get an app password at: https://account.infomaniak.com → Security → App passwords
      - KDRIVE_URL=${KDRIVE_URL:-}
      - KDRIVE_USER=${KDRIVE_USER:-}
      - KDRIVE_PASS=${KDRIVE_PASS:-}
      - KDRIVE_MOUNT=${KDRIVE_MOUNT:-/data/kdrive}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8504/api/pi-web/runtime >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

# Named volume for persistent data (sessions, workspaces, Pi config).
volumes:
  pi-web-data:
